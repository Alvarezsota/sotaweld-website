<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="sota-build" content="20260829d">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Employee Login | State of the Arc Welding & Services</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dark-theme.css?v=20260829d">
<link rel="stylesheet" href="login.css?v=20260829d">
</head>
<body class="employee-body">
<div class="login-bg" aria-hidden="true"></div>
<div class="login-wrap">
  <div class="login-card card">
    <img src="../assets/img/logo.jpeg" alt="State of the Arc Welding logo" class="login-logo">
    <h1>Employee Login</h1>
    <p class="login-sub">State of the Arc Welding &amp; Services</p>
    <form id="loginForm">
      <label class="field-label">Email
        <input type="email" class="input" id="email" required autocomplete="username">
      </label>
      <label class="field-label">Password
        <input type="password" class="input" id="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn2 btn2-solid" id="loginBtn">Log In</button>
      <p class="error-msg2" id="errorMsg"></p>
    </form>
    <form id="mfaForm" style="display:none;">
      <p class="login-sub" style="margin-bottom:16px;">Enter the six-digit code from your
         authenticator app.</p>
      <label class="field-label" for="mfaCode">Code</label>
      <input class="input" id="mfaCode" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" placeholder="000000" style="letter-spacing:.4em;text-align:center;font-size:20px;">
      <button type="submit" class="btn2 btn2-solid" id="mfaBtn" style="margin-top:14px;">Continue</button>
      <p class="error-msg2" id="mfaError"></p>
    </form>

    <form id="setPasswordForm" style="display:none;">
      <p class="login-sub" style="margin-bottom:16px;">Welcome! Set a password for your account.</p>
      <label class="field-label">New Password
        <input type="password" class="input" id="newPassword" required autocomplete="new-password" minlength="6">
      </label>
      <label class="field-label">Confirm Password
        <input type="password" class="input" id="confirmPassword" required autocomplete="new-password" minlength="6">
      </label>
      <button type="submit" class="btn2 btn2-solid" id="setPasswordBtn">Set Password &amp; Continue</button>
      <p class="error-msg2" id="setPasswordError"></p>
    </form>
    <a href="../index.html" class="back-link">&larr; Back to website</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js?v=20260829d"></script>
<script src="login.js?v=20260829d"></script>

</body>
</html>
