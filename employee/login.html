<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Login | State of the Arc Welding & Services</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="employee.css">
</head>
<body class="employee-body">
<div class="login-wrap">
  <div class="login-card">
    <img src="../assets/img/logo.jpeg" alt="State of the Arc Welding logo" class="login-logo">
    <h1>Employee Login</h1>
    <p class="login-sub">State of the Arc Welding &amp; Services</p>
    <form id="loginForm">
      <label>Email
        <input type="email" id="email" required autocomplete="username">
      </label>
      <label>Password
        <input type="password" id="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-red" id="loginBtn">Log In</button>
      <p class="error-msg" id="errorMsg"></p>
    </form>
    <a href="../index.html" class="back-link">&larr; Back to website</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="login.js"></script>
</body>
</html>
